{% extends 'base.html' %}

{% block content %}
<section class="login-section" style="padding: 100px 0; background-color: #f8f9fa; min-height: 70vh;">
    <div class="container" style="max-width: 400px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        
        <h2 style="text-align: center; color: #1a202c; margin-bottom: 30px;">Acesso à Conta</h2>
        
        <!-- Exibe mensagens de erro ou sucesso -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div style="padding: 10px; margin-bottom: 20px; border-radius: 5px; text-align: center; 
                                background-color: {% if category == 'danger' %}#fed7d7{% else %}#c6f6d5{% endif %};
                                color: {% if category == 'danger' %}#9b2c2c{% else %}#22543d{% endif %};">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #4a5568;">E-mail</label>
                <input type="email" name="email" required style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 4px;">
            </div>
            
            <div style="margin-bottom: 30px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #4a5568;">Senha</label>
                <input type="password" name="senha" required style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 4px;">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" style="width: 100%; font-size: 1.1rem; padding: 12px;">ENTRAR</button>
        </form>
    </div>
</section>
{% endblock %}
